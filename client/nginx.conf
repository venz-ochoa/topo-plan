#this is for the nginx server config used in docker
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  #this is for sending /api calls to the express container
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
  }

  #this is for the react single page app fallback (always serve index.html)
  location / {
    try_files $uri /index.html;
  }
}
