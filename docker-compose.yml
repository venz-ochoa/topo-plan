#this is for the three services (db, api, web) - start everything with: docker compose up --build
services:
  #this is for the postgres database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      #this is for keeping the data between restarts
      - pgdata:/var/lib/postgresql/data
      #this is for running init.sql automatically the first time the database starts
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 10

  #this is for the express api
  api:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 3001
      #this is for the database url (the api container reaches the db by its service name)
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  #this is for the react app (built and served by nginx)
  web:
    build: ./client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
